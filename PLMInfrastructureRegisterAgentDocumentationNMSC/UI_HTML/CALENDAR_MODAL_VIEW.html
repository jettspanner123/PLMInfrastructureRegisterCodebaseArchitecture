<!-- Custom Styles for Diagonal Stripes & Precise Fluent styling -->
<style data-purpose="custom-patterns">
    .striped-left-border {
      background: repeating-linear-gradient(
        -45deg,
        #7b83eb,
        #7b83eb 3px,
        #2a2b4d 3px,
        #2a2b4d 6px
      );

    /* Scrollbar styles to match Teams dark UI */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #141414;
    }

      background: #444444;

<style data-purpose="slot-booking-animations">
    .calendar-slot {
      cursor: pointer;
      position: relative;
      transition: background-color 0.16s ease, box-shadow 0.16s ease;
    }
    .calendar-slot:hover {
      background-color: rgba(91, 95, 199, 0.12);
    }
    @keyframes slotPulse {
      0%, 100% {
        box-shadow: inset 0 0 0 1.5px rgba(123, 131, 235, 0.85), 0 0 0 0 rgba(91, 95, 199, 0.35);
      }
      50% {
        box-shadow: inset 0 0 0 1.5px rgba(123, 131, 235, 1), 0 0 12px 1px rgba(91, 95, 199, 0.3);
      }
    }
    .slot-start-active {
      background-color: rgba(91, 95, 199, 0.28) !important;
      animation: slotPulse 1.8s ease-in-out infinite;
      z-index: 5;
    }
    .slot-range-preview {
      background-color: rgba(91, 95, 199, 0.22);
      box-shadow: inset 0 0 0 1px rgba(123, 131, 235, 0.45);
      transition: background-color 0.14s ease, box-shadow 0.14s ease;
    }
    .slot-start-badge {
      position: absolute;
      top: 4px;
      right: 6px;
      background-color: #5b5fc7;
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.02em;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
    @keyframes eventPopIn {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .booked-event-card {
      animation: eventPopIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<script data-purpose="interactive-slot-booking">
  (function () {
    const HOURS_START = 8;
    const HOURS_END = 17;
    const HOURS_COUNT = HOURS_END - HOURS_START + 1; // 10
    const SLOT_HEIGHT_PX = 96; // h-24 = 6rem = 96px

    const slots = Array.from(document.querySelectorAll('.calendar-slot'));
    let startSlot = null; // { day, hour, index, el }

    function getSlotIndex(day, hour) {
      return day * HOURS_COUNT + (hour - HOURS_START);
    }

    function formatHour(hour) {
      return `${String(hour).padStart(2, '0')}:00`;
    }

    function clearPreview() {
      slots.forEach((el) => {
        el.classList.remove('slot-start-active', 'slot-range-preview');
        const badge = el.querySelector('.slot-start-badge');
        if (badge) badge.remove();
      });
    }

    function cancelSelection() {
      startSlot = null;
      clearPreview();
    }

    function highlightRange(hoverIndex) {
      if (!startSlot) return;
      const minIdx = Math.min(startSlot.index, hoverIndex);
      const maxIdx = Math.max(startSlot.index, hoverIndex);

      slots.forEach((el) => {
        const day = Number(el.dataset.day);
        const hour = Number(el.dataset.hour);
        const idx = getSlotIndex(day, hour);
        if (idx >= minIdx && idx <= maxIdx && idx !== startSlot.index) {
          el.classList.add('slot-range-preview');
        } else {
          el.classList.remove('slot-range-preview');
        }
      });
    }

    function createBookedEvent(day, startHour, endHour) {
      const col = document.querySelector(`[data-day-col="${day}"]`);
      if (!col) return;

      const topPx = (startHour - HOURS_START) * SLOT_HEIGHT_PX + 4;
      const spanHours = endHour - startHour + 1;
      const heightPx = spanHours * SLOT_HEIGHT_PX - 8;

      const card = document.createElement('div');
      card.className = 'booked-event-card absolute inset-x-1 bg-[#3d375a] border border-[#5b5fc7]/60 rounded cursor-pointer overflow-hidden flex shadow-md hover:brightness-110 transition-all z-10';
      card.style.top = `${topPx}px`;
      card.style.height = `${heightPx}px`;

      card.innerHTML = `
        <div class="w-1 bg-[#7b83eb] flex-shrink-0"></div>
        <div class="flex-1 p-2 flex flex-col justify-between overflow-hidden">
          <div class="flex items-start justify-between gap-1">
            <span class="text-xs font-semibold text-white truncate leading-tight">Booked Meeting</span>
            <span class="text-[10px] font-medium text-[#c8c8c8] bg-[#464775] px-1.5 py-0.5 rounded flex-shrink-0">${formatHour(startHour)} – ${formatHour(endHour + 1)}</span>
          </div>
          <div class="flex items-center text-[11px] text-[#c8c8c8] truncate leading-tight">
            <span class="truncate">Microsoft Teams</span>
          </div>
        </div>
      `;

      col.appendChild(card);
    }

    function finalizeBooking(endDay, endHour) {
      const endIndex = getSlotIndex(endDay, endHour);
      const minIdx = Math.min(startSlot.index, endIndex);
      const maxIdx = Math.max(startSlot.index, endIndex);

      const firstDay = Math.floor(minIdx / HOURS_COUNT);
      const lastDay = Math.floor(maxIdx / HOURS_COUNT);

      for (let d = firstDay; d <= lastDay; d++) {
        const dayStartHour = d === firstDay ? HOURS_START + (minIdx % HOURS_COUNT) : HOURS_START;
        const dayEndHour = d === lastDay ? HOURS_START + (maxIdx % HOURS_COUNT) : HOURS_END;
        createBookedEvent(d, dayStartHour, dayEndHour);
      }

      cancelSelection();
    }

    slots.forEach((el) => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.booked-event-card')) return;

        const day = Number(el.dataset.day);
        const hour = Number(el.dataset.hour);
        const index = getSlotIndex(day, hour);

        if (!startSlot) {
          startSlot = { day, hour, index, el };
          el.classList.add('slot-start-active');
          const badge = document.createElement('span');
          badge.className = 'slot-start-badge';
          badge.textContent = 'Start';
          el.appendChild(badge);
          return;
        }

        if (startSlot.index === index) {
          cancelSelection();
          return;
        }

        finalizeBooking(day, hour);
      });

      el.addEventListener('mouseenter', () => {
        if (!startSlot) return;
        const day = Number(el.dataset.day);
        const hour = Number(el.dataset.hour);
        highlightRange(getSlotIndex(day, hour));
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && startSlot) {
        cancelSelection();
      }
    });
  })();
</script>
